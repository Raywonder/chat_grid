# Canonical Indiginous web alias for the next coordinated release.
# Keep /indiginous/ and /chatgrid/ served as update compatibility routes.

ProxyPass        /indiginous/ws  ws://127.0.0.1:18765/indiginous/ws
ProxyPassReverse /indiginous/ws  ws://127.0.0.1:18765/indiginous/ws

ProxyPass        /indiginous/auth/session/  http://127.0.0.1:18765/indiginous/auth/session/
ProxyPassReverse /indiginous/auth/session/  http://127.0.0.1:18765/indiginous/auth/session/

ProxyPass        /indiginous/voice/  http://127.0.0.1:18765/voice/
ProxyPassReverse /indiginous/voice/  http://127.0.0.1:18765/voice/

<LocationMatch "^/indiginous/?$|^/indiginous/index\.html$">
  Header set Cache-Control "no-store, no-cache, must-revalidate"
  Header set Pragma "no-cache"
  Header set Expires "0"
</LocationMatch>
